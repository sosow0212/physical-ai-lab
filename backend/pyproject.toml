[project]
name = "pal-backend"
version = "0.1.0"
description = "Physical AI Lab 백엔드 (FastAPI api + ingestion worker)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "motor>=3.6",
    "redis>=5.2",
    "pymupdf>=1.25",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
]
data = [
    "fpdf2>=2.8",
    "matplotlib>=3.10",
    "Pillow>=11.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# 샘플 콘텐츠 데이터 파일 — 한국어 긴 문자열 라인 길이 예외
"scripts/manuals_content.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
